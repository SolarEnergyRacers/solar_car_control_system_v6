# Example for der SER6 Configuration Data File 'SER6CNFG.INI'
[Main]
LogFilename = /SER6DATA.csv # 8+3 filename schema
LogFilePeriod = 2           # [h], after that a new log file is created, 0 - never
LogInterval = 2000          # [ms]

[TaskTimings]
#SleepTimeIOExt=400 # [ms]

[PID]
Kp = 22   # proportional
Ki = 15   # integral
Kd = 1    # differential
GlideMode = 0 # 0...7: 0:glide, 3:half glide/half recup, 7:recuperation

[Communication]
#I2CFrequence = 50       # [Hz] -- I2C_FREQ 200000 -> 200kHz | 100000 -> 100kHz | 50000 // 50kHz
#CarDataLogPeriod = 1000  # [ms]
Serial1Baudrate = 115200 # baud
Serial2Baudrate = 115200 # baud

[Telemetry]
SendInterval = 1000    # [ms]
MaxCachedRecords = 100 # number of telemetry records hold in cache in case of trasmit errors

[DriverDisplay]
DataFrameY = 0        # position of the data area, except the lifeSign indicator
InfoFrameY = 184      # position of the info text area;
